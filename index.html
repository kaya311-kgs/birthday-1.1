<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>A Special Surprise Hon!</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="stage">
  <!-- Colorful Floating Background Elements -->
  <div class="bg-sparkle" style="left: 10%; animation-delay: 0s;">💖</div>
  <div class="bg-sparkle" style="left: 25%; animation-delay: 1.5s;">✨</div>
  <div class="bg-sparkle" style="left: 50%; animation-delay: 0.5s;">🌸</div>
  <div class="bg-sparkle" style="left: 75%; animation-delay: 2.5s;">⭐</div>
  <div class="bg-sparkle" style="left: 90%; animation-delay: 1s;">💖</div>

  <!-- Colorful Cover Screen with Zipper -->
  <div id="closed">
    <div class="gift-icon">🎁</div>
    <h2>A Special Surprise!</h2>
    <p>Unzip to open our Love</p>
    <div id="zip-track">
      <div id="zip-pull"></div>
    </div>
    <p id="hint">👇 Swipe / Drag Down</p>
  </div>
</div>

<audio id="zipAudio" src="assets/zipper.mp3" preload="auto"></audio>

<script src="assets/script.js"></script>
</body>
</html>
